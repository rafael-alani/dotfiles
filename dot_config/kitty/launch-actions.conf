# Edit source/configuration files received from Finder.
protocol file
ext py,pyi,pyw,java,kt,kts,scala,c,h,cc,cpp,cxx,hpp,cs,go,rs,js,jsx,mjs,cjs,ts,tsx,lua,rb,php,swift,r,jl,sh,bash,zsh,fish,sql,json,jsonc,toml,yaml,yml,xml,css,scss,sass,less,vue,svelte,conf,ini,cfg
action launch --type=os-window -- ${SHELL} -lic 'cd (dirname "$argv[1]"); and exec lvim -- "$argv[1]"' ${FILE_PATH}
